{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pages">
  {% if page_obj.has_previous %}
  <a class="pg-btn" href="?page={{ page_obj.previous_page_number }}">← Pichla</a>
  {% else %}
  <span class="pg-btn pg-disabled">← Pichla</span>
  {% endif %}

  <span class="pg-info">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>

  {% if page_obj.has_next %}
  <a class="pg-btn" href="?page={{ page_obj.next_page_number }}">Agla →</a>
  {% else %}
  <span class="pg-btn pg-disabled">Agla →</span>
  {% endif %}
</nav>
{% endif %}
